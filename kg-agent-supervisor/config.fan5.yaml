# Supervisor config for the "fan5" Gemini agent (gemclaw-fan5.service).
# Run with:  python3 -m kgsupervisor --config config.fan5.yaml
#
# Secrets are NOT in this file — set them in the environment before running:
#   export KGS__CHAT__GOOGLE__SPACE="spaces/BBBByyyyyyy"        # fan5's space
#   export KGS__CHAT__GOOGLE__CREDENTIALS_FILE="/path/to/sa.json"
#   export KGS__CHAT__GOOGLE__BOT_NAME="<fan5 bot display name>"  # required if
#                                  # both agents share one space
#   # optional, to post via your existing webhook instead of the API:
#   # export KGS__CHAT__GOOGLE__WEBHOOK_URL="https://chat.googleapis.com/v1/..."

graph_file: examples/sample_graph.json   # <- point this at your real task graph

chat:
  transport: google_chat
  google:
    space: null               # via env KGS__CHAT__GOOGLE__SPACE
    credentials_file: null     # via env KGS__CHAT__GOOGLE__CREDENTIALS_FILE
    bot_name: null             # via env KGS__CHAT__GOOGLE__BOT_NAME
    track_edits: true
    stability_seconds: 12
    final_marker: null

recovery:
  restart:
    method: shell
    shell_command: "ssh anshdholakia.c.googlers.com -- sudo systemctl restart gemclaw-fan5.service"
    shell_timeout_seconds: 60
    readiness:
      command: "ssh anshdholakia.c.googlers.com -- systemctl is-active --quiet gemclaw-fan5.service"
      timeout_seconds: 180
      poll_interval: 5
  restart_grace_seconds: 15
  max_attempts: 4
  backoff_base_seconds: 5
  backoff_max_seconds: 120
  failure_phrases: []

run:
  response_timeout: 300
  poll_interval: 4
  inter_node_delay: 2
  thread_key: null
  state_file: .kgs_state.fan5.json
